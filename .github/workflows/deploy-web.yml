# Publishes the web app as plain files on GitHub Pages (D41, ROADMAP T0.3):
#   https://<owner>.github.io/Sparrow/
#
# `STATIC_EXPORT=1` makes `next build` write every page to apps/web/out (all pages are client
# pages that talk to Supabase from the browser, so nothing needs a server). The site is served
# from the /Sparrow folder, so NEXT_PUBLIC_BASE_PATH is set to that.
#
# Supabase's public values come from repository variables (Settings > Secrets and variables >
# Actions > Variables): NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY. Both are
# public by design (the anon key only has what RLS allows). Without them the site still deploys
# and shows its "not set up yet" message; the run says so in a notice.
#
# After the first deploy, add https://<owner>.github.io/Sparrow/auth/callback to the Supabase
# project's allowed redirect URLs (Authentication > URL Configuration) so sign-in links work.
name: Deploy web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue one after another; each pull request has its own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check the Supabase variables
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice title=Site not connected::Repository variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY are not set, so the site will show its setup message. See the comment at the top of deploy-web.yml."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the export
        working-directory: apps/web/out
        run: |
          for page in index.html 404.html today.html login.html go.html auth/callback.html manifest.webmanifest sw.js offline.html; do
            test -f "$page" || { echo "::error::$page is missing from the export"; exit 1; }
          done
          grep -q "src=\"$NEXT_PUBLIC_BASE_PATH/_next/static/" index.html || { echo "::error::pages do not load scripts from $NEXT_PUBLIC_BASE_PATH"; exit 1; }
          grep -q "href=\"$NEXT_PUBLIC_BASE_PATH/manifest.webmanifest\"" index.html || { echo "::error::the manifest link has no base path"; exit 1; }
          grep -q 'http-equiv="Content-Security-Policy"' index.html || { echo "::error::the pages carry no Content-Security-Policy"; exit 1; }
          touch .nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: The landing page answers
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PAGE_URL" -o page.html && grep -q "<title>Sparrow</title>" page.html; then
              echo "Landing page is live at $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::$PAGE_URL did not serve the landing page"; exit 1
