# Deploys the database and Edge Functions to the real Supabase project (ROADMAP T0.2).
#
# - On a push to main that touches supabase/: `supabase db push` applies any new migrations, then
#   `supabase functions deploy` deploys every function in supabase/functions. The first deploy also creates
#   the Web Push (VAPID) keys as function secrets.
# - On a pull request that touches supabase/: the same CLI pushes all migrations into a throwaway
#   PostgreSQL 16 (with supabase/tests/supabase_stub.sql standing in for Supabase's own schemas),
#   so a migration the CLI cannot apply is caught before it reaches main. Nothing real is touched.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project's reference id (the part before .supabase.co)
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
# Without all three the deploy job ends green with a notice and does nothing.
#
# Migrations are applied once and never edited (CLAUDE.md), so a push only ever adds new ones.
name: Deploy database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-db.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-db.yml"

# One deploy at a time, and never cancel one half way through.
concurrency:
  group: deploy-db-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  # Pull requests: prove the CLI can apply every migration in order.
  push-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway container, so no password at all
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: |
          createdb pushcheck
          psql -q -v ON_ERROR_STOP=1 -d pushcheck -f supabase/tests/supabase_stub.sql
      - name: supabase db push (throwaway database)
        run: supabase db push --db-url "postgresql://postgres@localhost:5432/pushcheck?sslmode=disable" --yes
      - name: A second push finds nothing to do
        run: |
          out=$(supabase db push --db-url "postgresql://postgres@localhost:5432/pushcheck?sslmode=disable" --dry-run --yes 2>&1)
          echo "$out"
          echo "$out" | grep -qi 'up to date' || { echo "::error::a second push still had migrations to apply"; exit 1; }

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Database not deployed::Missing repository secrets:$missing. Add them to deploy to Supabase (see the comment at the top of deploy-db.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply new migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      # Web Push (D38): a VAPID key pair is made once and kept in the project's function secrets. The
      # private key is masked and never printed; the public key is served by the notify function.
      - name: Create the Web Push keys (first deploy only)
        if: steps.secrets.outputs.ready == 'true'
        env:
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # Listed on its own first: if listing fails, the step stops instead of replacing the live keys.
          list=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")
          if grep -q VAPID_PUBLIC_KEY <<<"$list"; then
            echo "Web Push keys already exist; leaving them as they are."
          else
            keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            pub=$(echo "$keys" | jq -r .publicKey)
            priv=$(echo "$keys" | jq -r .privateKey)
            echo "::add-mask::$priv"
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" VAPID_PUBLIC_KEY="$pub" VAPID_PRIVATE_KEY="$priv" VAPID_SUBJECT="$VAPID_SUBJECT" >/dev/null
            echo "Created the Web Push keys."
          fi
      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        run: |
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
          # remind is called by the database's own cron job (pg_net), which has no user token; its permission
          # is the job's secret, checked by the database (migration 0029).
          supabase functions deploy remind --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      # Reminders (T2.2): record the remind function's address and schedule the five-minute job. Uses the
      # project's service key for this one call (masked); prints only what the database answered.
      - name: Schedule reminders
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # The legacy service_role key (a JWT) or a newer secret key (sb_secret_…, sent as apikey only).
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret")][0].api_key // empty')
          [ -n "$key" ] || { echo "::error::could not read the project's service key"; exit 1; }
          echo "::add-mask::$key"
          auth=()
          [[ "$key" == ey* ]] && auth=(-H "Authorization: Bearer $key")
          base="https://$SUPABASE_PROJECT_REF.supabase.co"
          answer=$(curl -fsS -X POST "$base/rest/v1/rpc/configure_reminders" \
            -H "apikey: $key" "${auth[@]}" -H "Content-Type: application/json" \
            -d "{\"p_function_url\": \"$base/functions/v1/remind\"}")
          echo "Reminders: $answer"
