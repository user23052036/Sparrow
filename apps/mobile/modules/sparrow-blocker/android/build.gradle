plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sparrowblocker'
version = '0.1.0'

android {
  namespace "expo.modules.sparrowblocker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // src/test holds plain JVM tests (also runnable without Gradle: ./run-jvm-tests.sh)
  testImplementation 'org.jetbrains.kotlin:kotlin-test'
}
