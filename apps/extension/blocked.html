<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This can wait · Sparrow</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      main {
        min-height: 100vh;
        display: grid;
        place-content: center;
        padding: 2rem;
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
      }
      svg {
        width: 140px;
        height: auto;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M4 52 Q32 44 60 54" stroke="var(--sparrow)" stroke-width="3" fill="none" stroke-linecap="round" />
        <path d="M18 44 Q20 28 34 26 Q44 25 46 34 L52 35 L46 38 Q44 46 32 47 Z M18 44 L10 48 L19 47 Z" fill="var(--sparrow)" />
        <circle cx="40" cy="32" r="1.8" fill="var(--mist)" />
      </svg>
      <h1>This can wait.</h1>
      <p>You asked Sparrow to keep this away during your focus time.</p>
      <p class="quiet" id="left"></p>
      <div class="row">
        <button class="primary" id="today">Back to my tasks</button>
        <button id="back">Go back</button>
      </div>
    </main>
    <script src="blocked.js" type="module"></script>
  </body>
</html>
