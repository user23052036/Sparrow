<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Sparrow</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #eef2ef;
        color: #1d2a2c;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141b1e;
          color: #e6ecea;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline for now</h1>
      <p>Sparrow needs a connection to load your day. Nothing is lost. Try again when you're back online.</p>
      <p><a href="/today">Try again</a></p>
    </main>
  </body>
</html>
